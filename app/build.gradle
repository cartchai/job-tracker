plugins { id 'com.android.application' }

android {
    namespace 'com.matttracker.workhours'
    compileSdk 34

    defaultConfig {
        applicationId 'com.matttracker.workhours'
        minSdk 29
        targetSdk 34
        versionCode 8501
        versionName '8.5.1'
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
